[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vimo-demo"
version = "0.1.0"
description = "Desktop capsule inspection with Basler acquisition, ViMo and FINS reporting"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = ["numpy==2.5.3", "PySide6==6.11.2"]

[dependency-groups]
dev = ["opencv-python==5.0.0.93", "pytest==9.1.1", "ruff==0.16.9", "pyright==1.1.414"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vimo_demo = ["py.typed", "web/static/*"]

[tool.uv]
cache-dir = "outputs/uv-cache"

[tool.ruff]
target-version = "py314"
src = ["src"]
extend-exclude = ["models", "images", "outputs", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts", "app.py"]
exclude = ["models", "images", "outputs", "data", ".venv"]
extraPaths = ["scripts"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers --basetemp=outputs/pytest-tmp"
markers = [
  "gpu: requires explicit --run-gpu and local ViMo runtime/model/images",
]
